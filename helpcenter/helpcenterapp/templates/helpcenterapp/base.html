{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block page_title %} {% endblock %}</title>
    <link rel="stylesheet" href={% static 'helpcenterapp/nav.css' %}>
    <link rel="stylesheet" href="{% block css_url %}{% endblock %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  </head>
  <body>
    <nav>
        <div class="navbar">
            <img src={% static 'helpcenterapp/logo.png' %} alt="Logo" cass="logo">
            <div class="buttons">
            <a id="login_navbutton" href="">Login</a>
            <a id="signup_navbutton" href="">Sign Up</a>
            </div>
        </div>
      </nav>
    {% block content %}

    {% endblock content %}
  </body>
</html>
